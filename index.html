<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Módulo 2 · Del fonema a la palabra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@600;700&display=swap">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1e2433;--mu:#5d667c;--ln:#e0e5f0;--soft:#eef2fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1c2130;--tx:#e9ecf5;--mu:#a5aec6;--ln:#2e3650;--soft:#252c42}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1c2130;--tx:#e9ecf5;--mu:#a5aec6;--ln:#2e3650;--soft:#252c42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:14px;max-width:780px;margin:auto}
.hero{background:linear-gradient(135deg,#3b5bdb,#7048e8 60%,#d6336c);color:#fff;border-radius:20px;padding:24px 20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(80,60,200,.25)}
.hero small{font-family:"Poppins","Nunito",system-ui,sans-serif;font-weight:700;opacity:.9;letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.hero h1,details.f>summary,th{font-family:"Poppins","Nunito",system-ui,sans-serif}
.hero h1{margin:6px 0 4px;font-size:26px;line-height:1.2}.hero p{margin:0;opacity:.92;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chips span{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 10px;font-size:12px}
details{border-radius:14px}
details.f{background:var(--card);border:1px solid var(--ln);border-left:6px solid var(--c);margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
details.f>summary{padding:14px;font-weight:600;font-size:16.5px;display:flex;gap:12px;align-items:center}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background-color:var(--c);background-image:linear-gradient(145deg,rgba(255,255,255,.28),rgba(0,0,0,.18));box-shadow:0 4px 10px color-mix(in srgb,var(--c) 40%,transparent);transition:.25s}.ic svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}details[open]>summary .ic{transform:rotate(-6deg) scale(1.06)}
summary small{display:block;font-weight:400;color:var(--mu);font-size:13px}
summary .ar{margin-left:auto;transition:.2s;color:var(--mu)}details[open]>summary .ar{transform:rotate(90deg)}
.in{padding:0 12px 12px}
details.i{background:var(--soft);margin:8px 0}
details.i>summary{padding:11px 13px;font-weight:600;font-size:15px;display:flex;gap:8px}
.in{counter-reset:n}
details.i>summary{align-items:center}
details.i>summary::before{counter-increment:n;content:counter(n);flex:none;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--c);background-image:linear-gradient(145deg,rgba(255,255,255,.28),rgba(0,0,0,.15));color:#fff;font:700 13px "Poppins","Nunito",sans-serif}
details.i>summary::after{content:"+";margin-left:auto;flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--c);font-weight:700;font-size:17px;transition:.2s}
details.i[open]>summary::after{content:"–";background:var(--c);color:#fff}
.b{padding:2px 14px 14px;font-size:15px}.b p{margin:8px 0}.b ul,.b ol{padding-left:20px;margin:6px 0}
.b em{font-style:normal;font-weight:700;color:var(--c)}
.ex{background:var(--card);border-radius:10px;padding:8px 12px;border:1px dashed var(--c)}
.tip,.warn{border-radius:10px;padding:8px 12px;font-size:14px}
.tip{background:rgba(47,158,68,.13)}.warn{background:rgba(245,159,0,.17)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);border-radius:10px;overflow:hidden}
th{background:var(--c);color:#fff;text-align:left}th,td{padding:7px 9px;border-bottom:1px solid var(--ln);vertical-align:top}
.sc{overflow-x:auto}
details.q{background:var(--card);margin:6px 0;border:1px solid var(--ln)}details.q>summary{padding:9px 12px;font-size:14.5px}details.q p{margin:0;padding:0 12px 10px}
footer{text-align:center;color:var(--mu);font-size:12px;margin:18px 0 8px}
</style></head><body>
<div class="hero"><small>Módulo 2</small><h1>Del fonema a la palabra</h1><div class="chips"><span>Fonemas y grafemas</span><span>La sílaba</span><span>Sílaba tónica y tildes</span></div></div>
<div id="app"></div>
<script>
const T=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const G=[
'<path d="M3 12h2M7 8v8M11 4v16M15 8v8M19 10v4"/>',
'<rect x="2.5" y="8" width="5" height="8" rx="1.5"/><rect x="9.5" y="8" width="5" height="8" rx="1.5"/><rect x="16.5" y="8" width="5" height="8" rx="1.5"/>',
'<path d="M14 3l-3 3.5"/><path d="M6 20l5-12 5 12M8 15h6"/>',
'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'];
const F=[
["#3b5bdb","2.1 Fonemas y grafemas","Sonidos y letras",[
["¿Qué es un fonema?",`<p>Un <b>fonema</b> es la unidad de sonido más pequeña de una lengua. Sirve para <b>distinguir una palabra de otra</b> al hablar o leer.</p><p class="ex">/s/ ≠ /m/ → <em>casa</em> ≠ <em>cama</em><br>/m/ ≠ /p/ → <em>masa</em> ≠ <em>mapa</em></p><p class="tip">💡 Los fonemas se escriben entre barras: /s/, /m/. Se oyen, no se ven.</p><p class="warn">⚠️ Fonema y sílaba <b>no son lo mismo</b>: una sílaba se forma con uno o varios fonemas.</p>`],
["¿Qué es un grafema?",`<p>Un <b>grafema</b> es la unidad mínima e indivisible de la escritura: una letra o signo escrito.</p><ul><li>La <em>p</em> es un grafema.</li><li>La <em>ch</em> se escribe con dos letras, pero representa <b>un solo fonema</b>. Lo mismo pasa con <em>ll</em>, <em>rr</em> y <em>qu</em>.</li></ul>`],
["Fonema vs. grafema",T(["","Fonema","Grafema"],[["Qué es","Sonido","Letra o signo escrito"],["Se percibe con","El oído","La vista"],["Se escribe","/entre barras/","Con letras"],["Ejemplo","/k/ se escribe c, qu o k: <em>casa, queso, kilo</em>","—"],["<em>hoja</em>","3 fonemas: /o/ /j/ /a/","4 grafemas: h-o-j-a (la h no suena)"]])],
["¿Para qué sirve?",`<p>Saber diferenciar fonemas de grafemas desarrolla la <b>conciencia fonológica</b>: la capacidad de reconocer y separar los sonidos del habla. Es clave para <b>aprender a leer y escribir</b> correctamente.</p>`]]],
["#2f9e44","2.2 La sílaba y sus tipos","Cuántas sílabas tiene una palabra",[
["¿Qué es una sílaba?",`<p>Es un sonido o grupo de sonidos que se pronuncia en <b>una sola emisión de voz</b>. Ejemplo: <em>a-mi-go</em> (3 sílabas).</p><ol><li>Todas las vocales pueden formar sílabas.</li><li>Las consonantes solas no forman sílabas.</li><li>Toda consonante debe ir acompañada de una vocal.</li><li>Una consonante forma sílaba con la vocal que le sigue.</li></ol>`],
["Según el número de sílabas",T(["Tipo","Sílabas","Ejemplos"],[["Monosílaba","1","pan, paz, pie, sal, red, rey, sed, ser"],["Bisílaba","2","al-fa, a-mor, án-gel, a-ño, a-quí, al-to"],["Trisílaba","3","a-mi-go, a-de-más, al-can-zar, as-pec-to"],["Polisílaba","4 o más","a-ba-ni-co, ca-ri-ta-ti-vo, des-co-no-ci-do, de-no-mi-na-dor"]])],
["Monosílabos y la tilde diacrítica",`<p>Los monosílabos <b>no llevan tilde</b>, salvo cuando hay dos iguales con distinta función gramatical. Esa tilde se llama <b>diacrítica</b>.</p>`+T(["Sin tilde","Con tilde"],[["<em>de</em> (preposición): El libro es de él.","<em>dé</em> (verbo dar): Dé las gracias."],["<em>si</em> (conjunción): Si lo hizo, no lo informó.","<em>sí</em> (afirmación): Sí, yo estuve presente."],["<em>que</em> (relativo/conjunción)","<em>qué</em> (interrogativo): ¿Qué grupo toca en el ITLA?"],["<em>tu</em> (posesivo): tu casa","<em>tú</em> (pronombre): tú cantas"],["<em>el</em> (artículo): el libro","<em>él</em> (pronombre): él vino"],["<em>mas</em> (pero)","<em>más</em> (cantidad)"],["<em>te</em> (pronombre): te llamo","<em>té</em> (bebida)"],["<em>se</em> (pronombre): se fue","<em>sé</em> (saber o ser): yo sé"]])],
["¿Por qué importa clasificarlas?",`<p>Saber cuántas sílabas tiene una palabra permite <b>acentuarla bien</b> y <b>dividirla correctamente al final del renglón</b>, siempre cortando entre sílabas: <em>ca-sa</em>.</p>`]]],
["#e8590c","2.3 Palabras según la sílaba tónica","Dónde cae la fuerza de la voz",[
["La sílaba tónica",`<p>Es la sílaba que se pronuncia con <b>más fuerza</b>. Las demás son átonas. En <em>ca-MIÓN</em> la tónica es <em>mión</em>.</p><p class="tip">💡 Truco: grita la palabra como si llamaras a alguien lejos (“¡ca-mióóón!”). La sílaba que alargas es la tónica.</p>`],
["Agudas",`<p>La fuerza va en la <b>última sílaba</b>. Llevan tilde si terminan en <b>n, s o vocal</b>.</p><p class="ex">Con tilde: ca-<em>mión</em>, co-ra-<em>zón</em>, so-<em>fá</em>, ca-<em>fé</em>, a-de-<em>más</em><br>Sin tilde: a-<em>mor</em>, pa-<em>pel</em>, re-<em>loj</em>, ciu-<em>dad</em></p>`],
["Llanas (graves)",`<p>La fuerza va en la <b>penúltima sílaba</b>. Llevan tilde si <b>no</b> terminan en n, s o vocal.</p><p class="ex">Sin tilde: <em>ca</em>-sa, <em>me</em>-sa, <em>can</em>-tan<br>Con tilde: <em>ár</em>-bol, <em>lá</em>-piz, ca-<em>rác</em>-ter</p>`],
["Esdrújulas",`<p>La fuerza va en la <b>antepenúltima sílaba</b>. <b>Siempre llevan tilde</b>.</p><p class="ex"><em>quí</em>-mi-ca, <em>fí</em>-si-ca, ma-te-<em>má</em>-ti-ca, te-<em>lé</em>-fo-no, <em>mú</em>-si-ca</p>`],
["Sobreesdrújulas",`<p>La fuerza va en una sílaba <b>anterior a la antepenúltima</b>. <b>Siempre llevan tilde</b>.</p><p>No existen como palabras simples: suelen ser <b>verbos con pronombres</b> (gerundio o imperativo).</p><p class="ex"><em>jú</em>-ra-me-lo, <em>vén</em>-de-se-lo, re-<em>cuér</em>-da-me-lo, per-<em>mí</em>-ta-se-me</p>`],
["Cuadro resumen",T(["Tipo","Fuerza en","Tilde","Ejemplo"],[["Aguda","Última","Si termina en n, s o vocal","camión, amor"],["Llana","Penúltima","Si NO termina en n, s o vocal","caza, árbol"],["Esdrújula","Antepenúltima","Siempre","química, física"],["Sobreesdrújula","Antes de la antepenúltima","Siempre","júramelo"]])],
["Cómo acentuar en 4 pasos",`<ol><li><b>Separa</b> la palabra en sílabas.</li><li><b>Ubica</b> la sílaba tónica.</li><li><b>Clasifica</b> la palabra: aguda, llana, esdrújula o sobreesdrújula.</li><li><b>Aplica</b> la regla de la tilde.</li></ol><p class="ex">árbol → ár-bol → tónica <em>ár</em> → llana → no termina en n, s ni vocal → <b>lleva tilde</b>.</p>`]]],
["#ae3ec9","Repaso rápido","Pon a prueba lo aprendido",[
["Autoevaluación (toca cada pregunta)",[["¿“Canción” es aguda, llana o esdrújula? ¿Por qué lleva tilde?","Aguda: la fuerza está en la última sílaba y termina en n."],["¿Cuántas sílabas tiene “desconocido” y qué tipo de palabra es?","Des-co-no-ci-do: 5 sílabas, es polisílaba."],["¿Por qué “árbol” lleva tilde?","Es llana y no termina en n, s ni vocal."],["Completa: “___ lo hizo, no lo informó” (si / sí)","“Si” sin tilde, porque es conjunción."],["¿“Música” lleva tilde siempre? ¿Por qué?","Sí. Es esdrújula, y todas las esdrújulas llevan tilde."]].map(q=>`<details class="q"><summary>${q[0]}</summary><p>✅ ${q[1]}</p></details>`).join('')]]]
];
document.getElementById('app').innerHTML=F.map(([c,t,s,fs],k)=>`<details class="f" style="--c:${c}"><summary><span class="ic"><svg viewBox="0 0 24 24">${G[k]}</svg></span><span>${t}<small>${s}</small></span><span class="ar">›</span></summary><div class="in">${fs.map(([n,h])=>`<details class="i"><summary>${n}</summary><div class="b">${h}</div></details>`).join('')}</div></details>`).join('');
</script></body></html>
